name: CI/CD landing
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint existing baseline and reject new violations
        run: npm run lint
      - name: Typecheck
        run: npx --no-install tsc --noEmit
  build-image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    env:
      IMAGE_TAG: ghcr.io/tergitran/nextinvoice-landing:sha-${{ github.sha }}-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Registry login
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for pushes and pull requests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          build-args: |-
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
            NEXT_PUBLIC_APP_URL=${{ vars.PUBLIC_APP_URL || 'https://app.nextinvoice.pro.vn' }}
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.nextinvoice.pro.vn/api' }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
          provenance: false
      - name: Smoke test actual runtime image
        run: |-
          docker run -d --name ci-web "$IMAGE_TAG"
          for attempt in $(seq 1 45); do
            status=$(docker inspect ci-web --format "{{.State.Health.Status}}")
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs ci-web
          exit 1
      - name: Remove isolated CI container
        if: always()
        run: docker rm -f ci-web 2>/dev/null || true
      - name: Publish tested image and capture immutable digest
        id: release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |-
          docker push "$IMAGE_TAG"
          reference=$(docker image inspect "$IMAGE_TAG" --format "{{index .RepoDigests 0}}")
          echo "image=$reference" >> "$GITHUB_OUTPUT"
  deploy:
    needs: build-image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
      cancel-in-progress: false
    steps:
      - name: Deploy verified digest with shared VPS lock and rollback
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image }}
          REVISION: ${{ github.sha }}
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 35m
          envs: IMAGE_REF,REVISION,DEPLOY_ENV,REGISTRY_USER,REGISTRY_TOKEN
          script: |-
            set -eu
            case "$DEPLOY_ENV" in
              staging) ROOT=/var/www/next-invoice-staging ;;
              prod) ROOT=/var/www/next-invoice ;;
              *) exit 2 ;;
            esac
            exec bash "$ROOT/deploy/scripts/deploy-release.sh" "$DEPLOY_ENV" landing "$IMAGE_REF" "$REVISION"
